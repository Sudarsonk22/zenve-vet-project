spring.application.name=zenve_vet
server.port=8080

spring.config.import=optional:file:./local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/zenve_vet?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root@

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Message attachments: stored on disk, the database keeps only a relative path.
# Keep max-file-size in step with VITE_MAX_ATTACHMENT_MB in the frontend .env.
app.uploads.dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Queries during view rendering are a surprise waiting to happen; be explicit.
spring.jpa.open-in-view=false
